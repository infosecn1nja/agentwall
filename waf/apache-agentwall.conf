# =============================================================================
# Apache 2.4 hardening against autonomous LLM/AI pentest agents
# -----------------------------------------------------------------------------
# Same honest limits as the nginx file: no tool-unique UA on attack traffic and
# per-request payload mutation mean signatures alone will not stop the agent.
# This covers burst rate limiting (mod_evasive), per-IP connection + request
# caps (mod_qos), static UA/marker filtering (mod_rewrite), and slow-request
# protection (mod_reqtimeout). Add mod_security + OWASP CRS for the real
# behaviour-based layer (notes at the bottom). Pair with fail2ban (separate file).
#
# Required modules:
#   a2enmod rewrite headers reqtimeout
#   apt install libapache2-mod-evasive libapache2-mod-qos libapache2-mod-security2
#   a2enmod evasive qos security2
# =============================================================================

# ---------------------------------------------------------------------------
# 1) Burst rate limiting per IP  (mod_evasive)  — enumeration / flood bursts
# ---------------------------------------------------------------------------
<IfModule mod_evasive24.c>
    DOSHashTableSize    3097
    DOSPageCount        5        # max hits to the SAME page / interval before block
    DOSPageInterval     1        # seconds
    DOSSiteCount        75       # max hits to the WHOLE site / interval before block
    DOSSiteInterval     1        # seconds
    DOSBlockingPeriod   60       # seconds blocked (extends on repeat hits)
    DOSLogDir           "/var/log/apache2/evasive"
    # DOSEmailNotify     soc@example.com
    DOSWhitelist        127.0.0.1
    # DOSWhitelist      10.0.0.*   # trusted scanners / monitoring
</IfModule>

# ---------------------------------------------------------------------------
# 2) Per-IP connection + request-rate caps  (mod_qos)
# ---------------------------------------------------------------------------
<IfModule mod_qos.c>
    QS_SrvMaxConnPerIP          50      # max concurrent connections per source IP
    QS_SrvMaxConnClose          70%     # disable keep-alive when this % of workers busy
    MaxClients                  256

    # Request-rate ceiling on auth / identity endpoints (credential stuffing,
    # auth enumeration). Match your real auth routes + auxiliary channels.
    QS_LocRequestLimitMatch     "^/(login|signin|auth|oauth|token|verify|otp|mfa|2fa|password/(reset|forgot))([/.?].*)?$" 30
</IfModule>

# ---------------------------------------------------------------------------
# 3) Slowloris / slow-request protection  (mod_reqtimeout)
# ---------------------------------------------------------------------------
<IfModule mod_reqtimeout.c>
    RequestReadTimeout header=5-10,MinRate=500 body=10,MinRate=500
</IfModule>

# ---------------------------------------------------------------------------
# 4) Static UA + injection-marker filtering  (mod_rewrite)
#    Supporting signal only — UAs are trivially changed; %{QUERY_STRING} is
#    URL-decoded by Apache so traversal markers match better here than on nginx,
#    but encoded/obfuscated payloads still slip past. Keep tuned.
# ---------------------------------------------------------------------------
<IfModule mod_rewrite.c>
    RewriteEngine On

    # Naive headless/automation User-Agents (supporting signal only)
    RewriteCond %{HTTP_USER_AGENT} "HeadlessChrome|PhantomJS|SlimerJS"      [NC,OR]
    RewriteCond %{HTTP_USER_AGENT} "playwright|puppeteer|selenium|webdriver"     [NC,OR]
    RewriteCond %{HTTP_USER_AGENT} "HtmlUnit|Cypress"                            [NC,OR]
    # Known autonomous-agent / scanner-default fingerprints (supporting signals).
    RewriteCond %{HTTP_USER_AGENT} "artex-enrich|artex-selfupdate|norma/"        [NC,OR]
    RewriteCond %{HTTP_USER_AGENT} "nuclei|sqlmap|ffuf|Fuzz Faster U Fool"       [NC,OR]
    RewriteCond %{HTTP_USER_AGENT} "Nmap Scripting Engine|dirsearch|wafw00f"     [NC,OR]
    RewriteCond %{HTTP_USER_AGENT} "arjun/|katana/|subfinder|naabu|gospider"     [NC,OR]
    RewriteCond %{HTTP_USER_AGENT} "interactsh|nikto|gobuster|feroxbuster"       [NC,OR]
    RewriteCond %{HTTP_USER_AGENT} "wpscan|masscan|zgrab|cyberstrikeai|^httpx/" [NC]
    RewriteRule ^ - [F,L]

    # Obvious injection / traversal probe markers
    RewriteCond %{QUERY_STRING} "\.\./"                   [NC,OR]
    RewriteCond %{QUERY_STRING} "'\s*or\s*'?[0-9]"        [NC,OR]
    RewriteCond %{QUERY_STRING} "union[\s/*]+select"      [NC,OR]
    RewriteCond %{QUERY_STRING} "<script"                 [NC,OR]
    RewriteCond %{QUERY_STRING} ";\s*drop\s+table"        [NC,OR]
    RewriteCond %{QUERY_STRING} "/etc/passwd"             [NC]
    RewriteRule ^ - [F,L]
</IfModule>

# ---------------------------------------------------------------------------
# 5) Real client IP behind a CDN/LB, so limits + bans key on the true source
# ---------------------------------------------------------------------------
# PICK ONE OF TWO MODES:
#
#   Mode A (recommended): mod_remoteip ON. Apache rewrites the client IP from
#   the CDN's header using ONLY trusted proxies, so %a is the real client and
#   fail2ban (which reads %a / the leading log field) bans the right IP. Run the
#   scorer WITHOUT --use-xff in this mode.
#
#   Mode B: no mod_remoteip, scorer with --use-xff. Then %a is the CDN/LB IP
#   while XFF carries the client — fail2ban will ban the CDN/LB, not the
#   attacker. Do NOT run fail2ban jails against this log in Mode B.
#
# Never trust a client-supplied X-Forwarded-For: your edge must overwrite (not
# append to) the header, and RemoteIPTrustedProxy must list only the CDN/LB
# ranges — otherwise anyone spoofs XFF and picks who gets banned.
<IfModule mod_remoteip.c>
    # RemoteIPHeader X-Forwarded-For
    # RemoteIPTrustedProxy 10.0.0.0/8
    # RemoteIPTrustedProxy 172.16.0.0/12
    # RemoteIPTrustedProxy 192.168.0.0/16
</IfModule>

# ---------------------------------------------------------------------------
# 6) The 'agentwall' access log — read by the ML scorer and fail2ban
# ---------------------------------------------------------------------------
# Keep the combined-format leading fields EXACTLY in this order:
#   <ip> <ident> <user> [time] "request" <status> <bytes> "referer" "ua" ...
# fail2ban's filters are anchored on them (^<HOST> -.*"METHOD /path HTTP/x" <status>)
# and the scorer's LOG_RE expects the same prefix. Only append fields after them.
#
# xff="%{X-Forwarded-For}i" is a trailing field the scorer can parse (with
# --use-xff it takes the left-most hop); logs '-' when the header is absent.
# rt=%D is total request time in microseconds (handy for SIEM, ignored by both).
LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" rt=%D xff=\"%{X-Forwarded-For}i\"" agentwall

# ENABLED: fail2ban jails and the ML scorer need this log to exist.
# If you run multiple vhosts, move this CustomLog inside each <VirtualHost>
# (and the LogFormat stays at server level) so each site gets its own file.
CustomLog /var/log/apache2/agentwall_access.log agentwall
# Permissions note: Apache creates the log root:adm 0640 by default; run the
# scorer with SupplementaryGroups=adm (or a dedicated group) to read it, or
# fail2ban (which runs as root) reads it fine.

# =============================================================================
# NEXT LAYER (recommended) — mod_security2 + OWASP CRS
# -----------------------------------------------------------------------------
#   a2enmod security2
#   apt install modsecurity-crs      # or clone coreruleset
#   # /etc/modsecurity/modsecurity.conf:  SecRuleEngine DetectionOnly  (then On)
#   # Include the CRS crs-setup.conf + rules/*.conf
#
# CRS anomaly scoring accumulates signal across the request and applies proper
# decoding transformations — this is what catches the adaptive multi-stage
# behaviour the mod_rewrite markers above cannot. Baseline in DetectionOnly
# first, then enable and raise paranoia level. Pair with fail2ban for the
# "persistence after 403/429" and "enumeration burst" behavioural legs.
# =============================================================================
