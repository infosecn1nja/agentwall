# =============================================================================
# nginx hardening against autonomous LLM/AI pentest agents
# -----------------------------------------------------------------------------
# Scope & honest limits:
#   - AGENTWALL attack traffic carries NO tool-unique User-Agent and the LLM mutates
#     payloads per request, so static signature blocking alone will NOT stop it.
#   - This config raises attacker cost and catches the NOISY legs: enrichment
#     fan-out, auth/credential-stuffing bursts, obvious injection probes, and
#     (via fail2ban, separate file) persistence past 403/429.
#   - Marker maps see the normalized URI and the raw query string, but NOT the
#     request body, and nginx map regexes do not URL-decode. Encoded or body
#     payloads need ModSecurity + OWASP CRS (notes at the bottom).
#   - Real per-IP enforcement of the ML verdicts is the companion OpenResty layer
#     `nginx-lua/agentwall_challenge_block.lua` (needs lua-nginx-module).
# =============================================================================

# ---------------------------------------------------------------------------
# MAIN/HTTP CONTEXT (nginx.conf) — put the zones + maps + log_format here
# ---------------------------------------------------------------------------
#
# OpenResty users: expose the Lua layer's configuration to workers. nginx does
# not pass arbitrary environment variables unless declared here (main context):
#
#   env AGENTWALL_REDIS_HOST;
#   env AGENTWALL_REDIS_PORT;
#   env AGENTWALL_REDIS_PASS;
#   env AGENTWALL_REDIS_DB;
#   env AGENTWALL_CHAL_SECRET;
#   env AGENTWALL_POW_DIFF;
#   env AGENTWALL_HEADLESS_MODE;
#   env AGENTWALL_HEADLESS_TTL;
#   env AGENTWALL_HEADLESS_BLOCK;
#   env AGENTWALL_HEADLESS_SUSPECT;
#   env AGENTWALL_MIN_SOLVE_MS;
#
# and in http {}:
#
#   lua_package_path "/etc/nginx/lua/?.lua;;";
#   lua_shared_dict agentwall_cache 2m;

# --- Rate-limit / connection zones -----------------------------------------
# Static assets are not counted by the general limiter (a cold page view
# fetches 30-100 assets at once); an empty key is "not accounted".
map $uri $agentwall_rl_key {
    default $binary_remote_addr;
    "~*\.(?:css|js|mjs|map|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|eot|mp4|webm)$" "";
}
limit_req_zone  $agentwall_rl_key   zone=agentwall_general:16m rate=15r/s;  # baseline per IP (non-static)
limit_req_zone  $binary_remote_addr zone=agentwall_auth:16m    rate=5r/m;   # login/identity endpoints
limit_conn_zone $binary_remote_addr zone=agentwall_conn:16m;                # concurrent conns per IP

# Return 429 (not 503) on throttle so fail2ban / SIEM can key on it.
limit_req_status  429;
limit_conn_status 429;

# --- Known autonomous-agent / prober User-Agents ---------------------------
# Supporting signal only. Trivially changed by the operator, so prefer tagging
# + logging over hard blocking. Absence of these UAs does NOT mean safety.
map $http_user_agent $agentwall_bad_ua {
    default               0;
    # Naive headless/automation UA claims (tagging only; stealth tooling spoofs
    # these. The authoritative headless check is JS report + timing in
    # nginx-lua/agentwall_challenge_block.lua).
    "~*HeadlessChrome"    1;
    # Electron/ deliberately absent: Slack/Teams/Discord/VS Code embed sites.
    "~*PhantomJS"         1;
    "~*SlimerJS"          1;
    "~*playwright"        1;
    "~*puppeteer"         1;
    "~*selenium"          1;
    "~*webdriver"         1;
    "~*HtmlUnit"          1;
    "~*Cypress"           1;
    # Known autonomous-agent / scanner-default fingerprints (supporting signal:
    # an operator can rotate UAs, so behaviour scoring remains the primary layer).
    # Allowlist your own monitoring/scanners if you rely on these tools.
    "~*artex-enrich"          1;
    "~*norma/"                1;
    "~*artex-selfupdate"      1;
    "~*nuclei"                1;
    "~*sqlmap"                1;
    "~*ffuf"                  1;
    "~*Fuzz Faster U Fool"    1;
    "~*Nmap Scripting Engine" 1;
    "~*dirsearch"             1;
    "~*wafw00f"               1;
    "~*arjun/"                1;
    "~*katana/"               1;
    "~*subfinder"             1;
    "~*naabu"                 1;
    "~*gospider"              1;
    "~*interactsh"            1;
    "~*nikto"                 1;
    "~*gobuster"              1;
    "~*feroxbuster"           1;
    "~*wpscan"                1;
    "~*masscan"               1;
    "~*zgrab"                 1;
    "~*cyberstrikeai"         1;
    "~*^httpx/"               1;
}

# --- Obvious injection / traversal markers ---------------------------------
# Stage-2 "probe" leg. PARTIAL: no body inspection, and the raw query string is
# not URL-decoded by map regexes (an encoded payload slips past here; the Python
# scorer re-checks a decoded copy). Treat this as a coarse first filter; CRS does
# this properly with transformations. Keep tuned to avoid false positives.
map "$uri|$query_string" $agentwall_probe {
    default                   0;
    "~*\.\./"                 1;   # path traversal (normalized URI + raw query)
    "~*'\s*or\s*'?[0-9]"      1;   # ' OR 1 ...
    "~*union[\s/*]+select"    1;   # UNION SELECT
    "~*<script"               1;   # reflected XSS probe
    "~*;\s*drop\s+table"      1;   # stacked DROP TABLE
    "~*/etc/passwd"           1;   # LFI probe
}

# --- Edge hard-deny switch: 0 = shadow (UA/probe matches are only logged as
# ua_flag=1 / probe=1), 1 = enforce (403). Flip to 1 in the enforce phase.
map $host $agentwall_edge_enforce {
    default 0;                        # <-- set to 1 when enforcing
}
map "$agentwall_edge_enforce:$agentwall_bad_ua:$agentwall_probe" $agentwall_edge_deny {
    default      0;
    "~^1:1:"     1;
    "~^1:\d:1$"  1;
}

# --- Access log that captures what fail2ban / the scorer / SIEM need -------
# The xff="..." tail is REQUIRED when the Python scorer runs with --use-xff.
# ua_flag/probe are computed by the maps above (tags, not hard decisions).
log_format agentwall '$remote_addr - $remote_user [$time_local] '
                 '"$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" '
                 'rt=$request_time urt=$upstream_response_time '
                 'ua_flag=$agentwall_bad_ua probe=$agentwall_probe '
                 'xff="$http_x_forwarded_for"';

# ---------------------------------------------------------------------------
# SERVER CONTEXT — apply inside each site's server block
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name example.com;          # <-- your host
    access_log /var/log/nginx/agentwall_access.log agentwall;

    # REQUIRED BEHIND A CDN/LB — recover the real client IP FIRST, so limits,
    # fail2ban bans and the ML scorer all key on the true source instead of the
    # proxy. Only list ranges you control/trust; with real_ip configured nginx
    # overwrites the log's $remote_addr with the client IP and strips spoofed
    # client-supplied XFF hops. If you skip this, fail2ban will ban your CDN.
    # set_real_ip_from 10.0.0.0/8;
    # set_real_ip_from 203.0.113.0/24;      # <-- your CDN/LB ranges
    # real_ip_header   X-Forwarded-For;
    # real_ip_recursive on;

    # --- Hard blocks, gated by $agentwall_edge_enforce (0 = shadow/log-only,
    # the default; see the map below). Server-scope `if` on a map var is safe.
    if ($agentwall_edge_deny) { return 403; }

    # --- Baseline per-IP limits (burst absorbs legit spikes, nodelay = no queue)
    limit_req  zone=agentwall_general burst=60 nodelay;
    limit_conn agentwall_conn 25;

    # --- Slowloris / slow-body protection
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    # --- Inline ML enforcement (OpenResty/lua-nginx-module only). nginx runs
    # limit_req/limit_conn in the preaccess phase BEFORE the access phase, so a
    # Redis outage or a rate-limited request cannot bypass the limiter.
    # access_by_lua_file /etc/nginx/lua/agentwall_challenge_block.lua;

    # ------------------------------------------------------------------
    # Tight throttle on authentication / identity-verification endpoints
    # (credential stuffing + auth enumeration).
    # Adjust the path regex to your app's real auth routes, including
    # auxiliary / partner / recruitment channels, which are weaker.
    # ------------------------------------------------------------------
    # Whole first path segment only (/authors, /tokenomics do NOT match).
    location ~* ^/(login|signin|sign-in|auth|oauth|token|verify|otp|mfa|2fa|password/(reset|forgot))(?:[/.]|$) {
        limit_req  zone=agentwall_auth burst=4 nodelay;   # ~5/min + small burst per IP
        limit_conn agentwall_conn 5;

        # proxy_pass http://app_backend;   # <-- your backend
        # include proxy_params;
    }

    # ------------------------------------------------------------------
    # Main app
    # ------------------------------------------------------------------
    location / {
        # proxy_pass http://app_backend;   # <-- your backend
        # include proxy_params;
    }
}

# =============================================================================
# NEXT LAYER (recommended) — ModSecurity v3 + OWASP CRS
# -----------------------------------------------------------------------------
#   apt install libnginx-mod-security   # or build libmodsecurity + connector
#   # /etc/nginx/modsec/main.conf:
#   #   Include /etc/nginx/modsec/modsecurity.conf
#   #   Include /etc/nginx/modsec/coreruleset/crs-setup.conf
#   #   Include /etc/nginx/modsec/coreruleset/rules/*.conf
#   # in server/location:
#   #   modsecurity on;
#   #   modsecurity_rules_file /etc/nginx/modsec/main.conf;
#
# CRS gives ANOMALY SCORING (accumulates across the request) + URL-decoding
# transformations + request-body inspection, which is what catches the adaptive
# multi-stage behaviour that the static maps above cannot. Start in
# DetectionOnly, baseline, then raise paranoia level. Pair with the fail2ban
# jails (separate file) for the "persistence after failure" and "enumeration
# burst" behavioural legs.
# =============================================================================
