name: Bug report
description: Report a reproducible defect in AgentWall (not a security vulnerability)
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not report vulnerabilities here** — use the
        private process in SECURITY.md. Also skim docs/THREAT-MODEL.md first:
        some behaviors (rotating IPs, stealth headless browsers, fail-open) are
        documented design limits, not bugs.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - scorer (Python)
        - nginx-lua challenge/enforcement
        - WAF configs (nginx/Apache)
        - fail2ban jails/filters
        - deploy (compose/systemd/secrets/logrotate)
        - observability (metrics/alerts)
        - tests/CI
        - docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v0.1.0 or git rev
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, OpenResty/nginx version, Redis version, Python version, Docker (if e2e), CDN/LB in front?
      placeholder: |
        Ubuntu 24.04, OpenResty 1.31, Redis 7.2, Python 3.12, behind Cloudflare
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Minimal commands/config (redact secrets, keys, hostnames, client IPs).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs / metrics
      description: Relevant error log lines, /metrics samples, scorer log tail.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I read docs/THREAT-MODEL.md and this is not a documented design limit.
          required: true
        - label: I removed secrets, client IPs, cookies and customer data from logs.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
