# /etc/fail2ban/filter.d/agentwall-auth.conf
# Auth abuse / credential stuffing: only 401/403 on authentication routes.
# Map the path group to your real auth + auxiliary/partner/recruitment endpoints.
[Definition]
failregex = ^<HOST> -.*"(?:GET|POST)[^"]*/(?:login|signin|auth|oauth|token|verify|otp|mfa|2fa|password/(?:reset|forgot))[^"]*" (?:401|403)\s
ignoreregex =
