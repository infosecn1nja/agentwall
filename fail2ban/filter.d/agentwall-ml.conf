# /etc/fail2ban/filter.d/agentwall-ml.conf
# Manual-ban jail filter for the ML scorer.
#
# The scorer bans IPs explicitly when run with --enforce --backend fail2ban:
#     fail2ban-client set agentwall-ml banip <ip>
# (add --fail2ban-sudo to prefix it with `sudo -n`, see deploy/sudoers.d-agentwall)
#
# Nothing should EVER match this filter — bans must come only from the scorer.
#
# Why not simply an empty `failregex =`:
#   fail2ban versions differ. Some accept an empty filter for a manual-ban jail;
#   others log a warning or fail to start the jail ("no valid regex"). A valid
#   but never-matching regex works on every version, keeps `fail2ban-client -t`
#   quiet, and stays inert. It can only match a request for the reserved path
#   /__agentwall_ml_never_match__ that returned the impossible status 599. The
#   `ignoreregex = .*` is a second belt: even such a line is ignored, so the
#   jail can never auto-ban from log contents.
#
# Keep the <HOST> tag: some fail2ban versions expect a host-extracting regex.
# Verify on YOUR version after install:
#   fail2ban-regex /var/log/nginx/agentwall_access.log /etc/fail2ban/filter.d/agentwall-ml.conf
#     -> expect 0 matched lines
#   fail2ban-client -t
#     -> expect "OK: configuration test is successful"
[Definition]
failregex = ^<HOST> - - \[[^\]]*\] "(?:GET|POST) /__agentwall_ml_never_match__ HTTP/[0-9.]+" 599\s
ignoreregex = .*
