# /etc/fail2ban/filter.d/agentwall-behavior.conf
# Persistence / enumeration: any 400/401/403/404/429 response. Each alone is
# normal; the jail threshold (many in a short window from one IP) is the signal.
[Definition]
#
# 429 is deliberately NOT counted: AgentWall itself answers 429 for the rate
# limiter AND for every request of a challenged client (the JS interstitial).
# Counting it turned "challenge this IP" into "firewall-ban this IP" (and, behind
# CGNAT, every user sharing it) before the visitor could even solve the PoW.
# The scorer still sees 429s as a persistence signal.
# 404s for static assets (stale bundles, missing favicons/source maps) are noise.
failregex = ^<HOST> -.*"(?:GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)[^"]*" (?:400|401|403|404)\s
ignoreregex = ^\S+ -.*"(?:GET|HEAD) [^" ?]*\.(?:css|js|mjs|map|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf)(?:\?[^" ]*)? HTTP/[0-9.]+" 404\s
